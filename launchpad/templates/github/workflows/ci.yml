# Run verification only for PRs to main.
# Keep the job name "ci" for branch protection.

name: ci

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0

      # Add repository toolchain and dependency setup before verification.
      - name: Verify
        run: pre-commit run --all-files
