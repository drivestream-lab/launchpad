apiVersion: launchpad/v1
kind: HarnessConfig
org: apex-common
delivery_contract: sdd-delivery/v2
delivery_roles:
  engineering-gate: pe-team

profiles:
  meta-pm:
    # constitution omitted — meta repos have no .cursor/rules submodule
    skills:
      - repo: prayog-skills
        ref: latest
    skill_runtimes:
      - .agents/skills
      - .claude/skills

# Per-repo overrides (optional).
# If absent, repo's harness_profile defaults to its stack from governance.yaml.
repos: {}
