apiVersion: prayog/v1
kind: DeliveryContract
id: sdd-delivery
version: 2
status: rc
workflow: workflow.yaml
github:
  labels:
    - name: impact-map-pending
      color: BFD4F2
      description: prd-impact-acceptance awaiting PE review
      profiles: [meta-pm]
    - name: spec-pending
      color: BFD4F2
      description: coding-readiness awaiting PE review
      profiles: [app]
    - name: spec-lgtm
      color: 0E8A16
      description: coding-readiness approved for current spec PR head
      profiles: [app]
  review_roles:
    prd-impact-acceptance:
      role: engineering-gate
      profiles: [meta-pm]
    coding-readiness:
      role: engineering-gate
      profiles: [app]
