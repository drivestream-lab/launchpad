apiVersion: launchpad/v1
kind: HarnessConfig
delivery_contract: sdd-delivery/v2
delivery_roles:
  engineering-gate: pe-team

# ─── Harness: constitution + agent skills + governance templates per stack ──
# Rename to harness-<org>.yaml (e.g. harness-apex-common.yaml).
# Run:  launchpad apply-harness --meta --dry-run   to preview.
#       launchpad apply-harness --meta --apply      to execute.
# Run:  launchpad status --meta                     to verify.
#
# constitution.ref — must be a pinned tag (never a branch).
# To upgrade rules: bump the ref here, then re-run apply-harness.
#
# skills[].ref — tenant-owned. Current kit tracks tip d3bd94e
# (wave-acceptance; required forge_skills; no /verify). Retag when published.
# Stack key == harness profile == prayog profiles/{stack_key}.yaml.
#
# owners.layout + owners.team — CODEOWNERS family (optional for known stacks;
#   migration defaults apply). layout: none skips CODEOWNERS.
# codeowners_template — optional file under meta config/templates/, or legacy
#   CODEOWNERS.<stack> name (shim + deprecation WARN). Prefer owners: instead.
# harness_pin_template — deprecated; pin is always generated (WARN if set).

org: example-org

profiles:
  # ─── Meta repo profile ───────────────────────────────────────────────────
  meta-pm:
    skills:
      - repo: prayog-skills
        ref: v0.5.4
    skill_runtimes:
      - .agents/skills
      - .claude/skills
    # owners defaults: team pm-team, layout meta
    # PM authoring: /prd-think → /prd-quality (prayog profile @ ref above)

  # ─── Python microservice profile ─────────────────────────────────────────
  python-backend:
    constitution:
      repo: python-services-rules
      ref: v2.1.0
    skills:
      - repo: prayog-skills
        ref: d3bd94e
    # owners defaults: team backend-devs, layout app_src

  # ─── Next.js frontend / BFF profile ──────────────────────────────────────
  # nextjs-frontend:
