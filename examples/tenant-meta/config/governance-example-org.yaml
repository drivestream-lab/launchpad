apiVersion: launchpad/v1
kind: GovernanceConfig

# ─── GitHub governance ─────────────────────────────────────────────────────
# Rename this file to governance-<org>.yaml (e.g. governance-apex-common.yaml).
# Run:  launchpad init-client --meta --dry-run   to preview.
#       launchpad init-client --meta --apply      to execute.
# Both are idempotent — safe to re-run after fixing config.
#
# Day 1: meta repo only.
# Day N: add app repos incrementally by uncommenting / adding blocks below.

org: example-org

# stack_profiles: declare every stack you use — YAML is SSOT (kit merges nothing).
stack_profiles:
  meta-pm: Programme management & ADR meta repo
  # Add stacks as you onboard repos; each needs a matching harness profile:
  # python-backend: Python / FastAPI microservice
  # nextjs-frontend: Next.js frontend or BFF
  # terraform-iac: Terraform infrastructure-as-code
  # flink: Flink streaming monorepo (domain team: data-platform-devs)
  # edge-agent: Edge agent services
  # platform-tooling: Kit/SSOT brownfield (optional)

teams:
  - name: platform-devs
    description: Platform engineering + Terraform IaC
    privacy: closed
  - name: backend-devs
    description: Backend developers
    privacy: closed
  - name: frontend-devs
    description: Frontend / BFF developers
    privacy: closed
  - name: data-platform-devs
    description: Data platform domain (owns flink; spark later)
    privacy: closed
  - name: edge-agent-devs
    description: Edge agent runtime
    privacy: closed
  - name: pm-team
    description: Programme management
    privacy: closed
  - name: pe-team
    description: Platform engineering (ADR / technical review)
    privacy: closed

repos:
  # ─── Day 1: meta repo (required) ─────────────────────────────────────────
  example-meta:
    stack: meta-pm                  # must be a key in stack_profiles
    teams: [platform-devs, pm-team] # must reference entries in teams[] above
    visibility: private
    description: Control-plane for example-org

  # ─── Day N: add app repos (uncomment when ready) ──────────────────────────
  # example-api:
  #   stack: python-backend
  #   teams: [platform-devs, backend-devs]
  #   visibility: private
  #   description: Core API service

  # example-portal:
  #   stack: nextjs-frontend
  #   teams: [frontend-devs, platform-devs]
  #   visibility: private
  #   description: Customer-facing web portal

  # example-infra:
  #   stack: terraform-iac
  #   teams: [platform-devs]
  #   visibility: private
  #   description: Terraform infrastructure modules

  # example-streaming:
  #   stack: flink
  #   teams: [data-platform-devs]
  #   visibility: private
  #   description: Flink streaming monorepo

  # example-edge-agent:
  #   stack: edge-agent
  #   teams: [edge-agent-devs]
  #   visibility: private
  #   description: Edge agent service

policy:
  default_branch: main
  integration_branch: develop
  require_pr_reviews: 1
  dismiss_stale_reviews: true

project_board:
  enabled: true
  name: "example-org Board"
